<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#2e5d45"/>
      <stop offset="1" stop-color="#152820"/>
    </linearGradient>
    <linearGradient id="dome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dcebe2"/>
    </linearGradient>
  </defs>
  <!-- Rounded background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Outer accent ring -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#1c9c87" stroke-width="0.8" opacity="0.3"/>
  <!-- Dome shape (mold/removal shield) -->
  <path d="M32 10c-9.5 0-17 6.8-17 16 0 1.2.14 2.4.4 3.5h33.2c.26-1.1.4-2.3.4-3.5 0-9.2-7.5-16-17-16z" fill="url(#dome)"/>
  <!-- Dome lower band -->
  <path d="M15.4 29.5c2.3 7.2 8.5 11.5 16.6 11.5s14.3-4.3 16.6-11.5z" fill="#5dd5bd"/>
  <!-- Highlight on dome -->
  <path d="M32 15c-5.5 0-10 3.6-10 8.4" fill="none" stroke="#2e5d45" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  <!-- Base/foundation bar -->
  <rect x="10" y="43" width="44" height="6" rx="3" fill="#ffffff"/>
  <!-- Small check mark inside dome -->
  <path d="M28 22.5l3 3 5.5-6" fill="none" stroke="#2e5d45" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
